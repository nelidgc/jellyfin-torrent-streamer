name: Windows CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-test:
    name: Node.js ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check torrent-jellyfin.mjs
      - run: node --test

  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $errors = @()
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

  release:
    name: Sanitized release ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node-test, powershell-syntax]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build allowlisted ZIP
        shell: pwsh
        run: .\build-release.ps1 -Version "${{ github.ref_name }}"
      - name: List and audit archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem -LiteralPath .\dist -Filter *.zip -File | Select-Object -First 1
          if (-not $zip) { throw "Release ZIP was not created." }
          $entries = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = @($entries.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $names | Sort-Object
            $forbidden = @($names | Where-Object {
              $_ -match '(^|/)(config\.json|data|bin|library)(/|$)' -or
              $_ -match '\.(torrent|strm|db|log|exe)$' -or
              $_ -match '(^|/)\.env(?:\.|$)'
            })
            if ($forbidden.Count -gt 0) { throw "Forbidden ZIP entries: $($forbidden -join ', ')" }
          }
          finally {
            $entries.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-torrent-streamer-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem -LiteralPath .\dist -Filter *.zip -File | Select-Object -First 1).FullName
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" $zip --clobber
          }
          else {
            gh release create "${{ github.ref_name }}" $zip --verify-tag --generate-notes --title "jellyfin-torrent-streamer ${{ github.ref_name }}"
          }
